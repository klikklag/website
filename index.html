<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>klikklag.space</title>
    <style>
        /* CSS Variables */
        :root {
            --bg-color: #050505;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --accent-primary: #8a2be2; /* BlueViolet */
            --accent-secondary: #ff00ff; /* Magenta */
            --card-bg: rgba(20, 20, 25, 0.6);
        }

        /* Reset & Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated Background Effects */
        .ambient-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -2;
            overflow: hidden;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.5;
            animation: float 20s infinite ease-in-out alternate;
        }

        .orb-1 {
            width: 400px;
            height: 400px;
            background: var(--accent-primary);
            top: -10%;
            left: -10%;
        }

        .orb-2 {
            width: 300px;
            height: 300px;
            background: var(--accent-secondary);
            bottom: 10%;
            right: -5%;
            animation-delay: -5s;
        }

        .orb-3 {
            width: 300px;
            height: 300px;
            background: #4b0082;
            top: 50%;
            left: 50%;
            animation-duration: 25s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0, 0) scale(1); }
        }

        /* Grid Overlay */
        .grid-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: -1;
            pointer-events: none;
        }

        /* Screen Transitions */
        .screen {
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        /* Intro Landing Screen */
        #intro-screen {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
            position: fixed;
            width: 100%;
            top: 0;
            left: 0;
            z-index: 10;
        }

        #intro-screen.fade-out {
            opacity: 0;
            transform: scale(1.1); /* Slight zoom in as it fades */
            pointer-events: none;
        }

        /* Main Feed Screen */
        #feed-screen {
            display: none; /* Hidden entirely until triggered */
            opacity: 0;
            transform: translateY(40px); /* Starts slightly lower */
            z-index: 5;
        }

        #feed-screen.visible {
            display: block;
        }

        #feed-screen.fade-in {
            opacity: 1;
            transform: translateY(0); /* Glides into place */
        }

        /* Typography */
        h1 {
            font-size: 4rem;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 1rem;
            background: linear-gradient(to right, #fff, var(--accent-primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(138, 43, 226, 0.3);
        }

        p.subtitle {
            font-size: 1.2rem;
            color: var(--text-muted);
            margin-bottom: 2.5rem;
            line-height: 1.6;
            max-width: 600px;
        }

        .feed-header h2 {
            font-size: 2.5rem;
            text-align: center;
            background: linear-gradient(to right, #fff, var(--accent-primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 3rem;
        }

        /* Call to Action Button */
        .cta-btn {
            display: inline-block;
            padding: 1rem 2.5rem;
            font-size: 1.1rem;
            font-weight: 600;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: transparent;
            border: 2px solid var(--accent-primary);
            border-radius: 30px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(138, 43, 226, 0.2);
        }

        .cta-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(138, 43, 226, 0.4), transparent);
            transition: all 0.4s ease;
        }

        .cta-btn:hover {
            background: var(--accent-primary);
            box-shadow: 0 0 30px rgba(138, 43, 226, 0.6);
            transform: translateY(-2px);
        }

        .cta-btn:hover::before {
            left: 100%;
        }

        /* Feed Layout */
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 4rem 2rem;
        }

        .feed-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        /* Post Cards */
        .post-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 1.5rem;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .post-card:hover {
            transform: translateY(-5px);
            border-color: rgba(138, 43, 226, 0.4);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 
                        0 0 20px rgba(138, 43, 226, 0.15);
        }

        .post-date {
            font-size: 0.8rem;
            color: var(--accent-primary);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .post-text {
            color: var(--text-main);
            line-height: 1.6;
            font-size: 1rem;
        }

        .post-image {
            width: 100%;
            height: auto;
            border-radius: 10px;
            object-fit: cover;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Responsive */
        @media (max-width: 600px) {
            h1 { font-size: 2.5rem; }
            .feed-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- Fixed Background -->
    <div class="ambient-bg">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>
    <div class="grid-overlay"></div>

    <!-- 1. Intro Landing Screen -->
    <div id="intro-screen" class="screen">
        <h1>klikklag.space</h1>
        <p class="subtitle">Bratku odpalaj tą stronke</p>
        <button id="enter-btn" class="cta-btn">Open this shi up</button>
    </div>

    <!-- 2. Main Feed Screen -->
    <div id="feed-screen" class="screen">
        <div class="container">
            <header class="feed-header">
                <h2>klikklag.space</h2>
            </header>

            <main class="feed-grid">
                <!-- Example Post 1 -->
                <article class="post-card">
                    <span class="post-date">System Log 01</span>
                    <img class="post-image" src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=600&auto=format&fit=crop" alt="Abstract space">
                    <p class="post-text">Musix to cwel</p>
                </article>

                <!-- Example Post 2 -->
                <article class="post-card">
                    <span class="post-date">System Log 02</span>
                    <p class="post-text">Kurwa ale kocham kolejowke</p>
                </article>

                <!-- Example Post 3 -->
                <article class="post-card">
                    <span class="post-date">Visual 01</span>
                    <img class="post-image" src="https://images.unsplash.com/photo-1550684848-fac1c5b4e853?q=80&w=600&auto=format&fit=crop" alt="Purple geometry">
                </article>
            </main>
        </div>
    </div>

    <!-- Animation Logic -->
    <script>
        document.getElementById('enter-btn').addEventListener('click', function() {
            const intro = document.getElementById('intro-screen');
            const feed = document.getElementById('feed-screen');

            // 1. Trigger fade out and zoom animation on intro
            intro.classList.add('fade-out');

            // 2. Wait for intro to fade, then show feed
            setTimeout(() => {
                intro.style.display = 'none'; // Remove from layout completely
                
                feed.classList.add('visible'); // Give it display: block
                
                // Slight delay to allow display:block to apply before triggering fade-in
                setTimeout(() => {
                    feed.classList.add('fade-in');
                }, 50);

            }, 800); // 800ms matches the CSS transition time
        });
    </script>

</body>
</html>
